server {
    listen 80;
    listen [::]:80;

    # Сервер слушает обращения по IP и по целевому домену
    server_name 195.209.215.196 rubezh-arh.ru www.rubezh-arh.ru;

    root /var/www/rubezh/html;
    index index.html;

    # Gzip сжатие текстовых ресурсов
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Astro Static Routing (обработка прямых ссылок и красивых URL без .html)
    location / {
        try_files $uri $uri/ $uri.html /404.html =404;
    }

    # Кэширование статических ассетов (изображения, стили, скрипты, шрифты)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|webp|avif)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Страница ошибки 404
    error_page 404 /404.html;

    # Запрет доступа к скрытым системным файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
