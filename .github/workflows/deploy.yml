name: Deploy Website to VDS (GitVerse)

on:
  push:
    branches:
      - main
  # Позволяет запускать сборку автоматически через Webhook от Sanity
  repository_dispatch:
    types: [sanity_update]
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Build & Deploy to VDS
    runs-on: ubuntu-latest
    if: contains(github.server_url, 'gitverse')
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚙️ Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.28.2

    - name: ⚙️ Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: ⚡ Install dependencies
      run: pnpm install

    - name: 🏗️ Build static site
      run: pnpm build

    - name: 🚀 Deploy to VDS via rsync
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        TARGET_DIR: /var/www/rubezh/html
      run: |
        echo "🔧 Настройка SSH окружения..."
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Корректируем переносы строк CRLF -> LF и гарантируем перевод строки в конце файла
        printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        echo "🔍 Валидация формата SSH ключа..."
        ssh-keygen -l -f ~/.ssh/deploy_key || {
          echo "❌ Ошибка: SSH-ключ имеет неверный формат или поврежден при вставке в секреты GitVerse!"
          echo "Первая строка ключа: $(head -n 1 ~/.ssh/deploy_key)"
          echo "Количество строк: $(wc -l < ~/.ssh/deploy_key)"
          exit 1
        }

        # Базовые опции SSH: поддержка RSA, отключение интерактивных вопросов
        SSH_OPTS="-p 22 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa,ssh-ed25519"

        echo "📡 Проверка SSH подключения к $DEPLOY_USER@$DEPLOY_HOST..."
        ssh -v $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "echo '✅ SSH connection successful!'"

        echo "📁 Проверка и подготовка целевой директории $TARGET_DIR..."
        ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "sudo mkdir -p $TARGET_DIR && sudo chown -R $DEPLOY_USER:$DEPLOY_USER $TARGET_DIR"

        echo "🔄 Синхронизация файлов сайта через rsync..."
        rsync -avz --delete \
          -e "ssh $SSH_OPTS" \
          --rsync-path="sudo rsync" \
          ./dist/ "$DEPLOY_USER@$DEPLOY_HOST:$TARGET_DIR/"

        echo "🔒 Настройка прав доступа для Nginx (www-data)..."
        ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "sudo chown -R www-data:www-data $TARGET_DIR && sudo chmod -R 755 $TARGET_DIR"

        echo "🧹 Очистка временного ключа..."
        rm -f ~/.ssh/deploy_key

        echo "🎉 Деплой успешно завершен!"
