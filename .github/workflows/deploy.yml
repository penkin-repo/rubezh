name: Deploy Website to VDS (GitVerse)

on:
  push:
    branches:
      - main
  # Позволяет запускать сборку автоматически через Webhook от Sanity
  repository_dispatch:
    types: [sanity_update]
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Build & Deploy to VDS
    runs-on: ubuntu-latest
    if: contains(github.server_url, 'gitverse')
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚙️ Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.28.2

    - name: ⚙️ Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: ⚡ Install dependencies
      run: pnpm install

    - name: 🏗️ Build static site
      run: pnpm build

    - name: 🚀 Deploy to VDS via rsync
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        TARGET_DIR: /var/www/rubezh/html
      run: |
        echo "🔧 Настройка SSH окружения..."
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Записываем SSH-ключ с переводом строки в конце
        printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        # Конфигурируем SSH клиент (RSA ключ, порт 22, отключение StrictHostKeyChecking)
        SSH_CMD="ssh -p 22 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAcceptedKeyTypes=+ssh-rsa"

        echo "📡 Проверка SSH подключения к $DEPLOY_USER@$DEPLOY_HOST..."
        $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "echo '✅ SSH connection successful!'"

        echo "📁 Подготовка целевой директории $TARGET_DIR на сервере..."
        $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "sudo mkdir -p $TARGET_DIR && sudo chown -R $DEPLOY_USER:$DEPLOY_USER $TARGET_DIR"

        echo "🔄 Синхронизация файлов сайта через rsync..."
        rsync -avz --delete \
          -e "$SSH_CMD" \
          --rsync-path="sudo rsync" \
          ./dist/ "$DEPLOY_USER@$DEPLOY_HOST:$TARGET_DIR/"

        echo "🔒 Настройка прав доступа для Nginx (www-data)..."
        $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "sudo chown -R www-data:www-data $TARGET_DIR && sudo chmod -R 755 $TARGET_DIR"

        echo "🧹 Очистка временного ключа на раннере..."
        rm -f ~/.ssh/deploy_key

        echo "🎉 Деплой успешно завершен!"
