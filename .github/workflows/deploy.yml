name: Deploy Website to VDS (GitVerse)

on:
  push:
    branches:
      - main
  # Позволяет запускать сборку автоматически через Webhook от Sanity
  repository_dispatch:
    types: [sanity_update]
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Build & Deploy to VDS
    runs-on: ubuntu-latest
    if: contains(github.server_url, 'gitverse')
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚙️ Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.28.2

    - name: ⚙️ Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: ⚡ Install dependencies
      run: pnpm install

    - name: 🏗️ Build static site
      run: pnpm build

    - name: 🚀 Deploy to VDS via rsync
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        TARGET_DIR: /var/www/rubezh/html
      run: |
        echo "🔧 Нормализация параметров подключения..."
        # Очищаем хост и пользователя от возможных пробелов и спецсимволов при вставке в UI
        TARGET_HOST=$(echo "${DEPLOY_HOST:-195.209.215.196}" | tr -d '[:space:]')
        TARGET_USER=$(echo "${DEPLOY_USER:-ubuntu}" | tr -d '[:space:]')
        
        # Если пользователь случайно указал root или старый логин от timeweb, принудительно используем ubuntu
        if [ "$TARGET_USER" = "root" ] || [ "$TARGET_USER" = "andr5n" ] || [ -z "$TARGET_USER" ]; then
          echo "⚠️ Замена пользователя '$TARGET_USER' на системного пользователя VDS 'ubuntu'"
          TARGET_USER="ubuntu"
        fi

        echo "Подключение будет выполняться как: $TARGET_USER@$TARGET_HOST"

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Записываем SSH-ключ с очисткой CRLF
        printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        echo "🔍 Валидация формата SSH ключа..."
        ssh-keygen -l -f ~/.ssh/deploy_key

        # Строгие параметры SSH для OpenSSH 9.x:
        # - IdentitiesOnly=yes: использовать строго deploy_key (не тратить попытки на дефолтные ключи раннера)
        # - PubkeyAcceptedAlgorithms=+ssh-rsa: современный синтаксис OpenSSH для RSA
        # - PubkeyAcceptedKeyTypes=+ssh-rsa: обратная совместимость
        SSH_OPTS="-p 22 -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa,ssh-ed25519"

        echo "📡 Проверка SSH подключения..."
        ssh -v $SSH_OPTS "$TARGET_USER@$TARGET_HOST" "echo '✅ SSH connection successful!'"

        echo "📁 Проверка и подготовка целевой директории $TARGET_DIR..."
        ssh $SSH_OPTS "$TARGET_USER@$TARGET_HOST" "sudo mkdir -p $TARGET_DIR && sudo chown -R $TARGET_USER:$TARGET_USER $TARGET_DIR"

        echo "🔄 Синхронизация файлов сайта через rsync..."
        rsync -avz --delete \
          -e "ssh $SSH_OPTS" \
          --rsync-path="sudo rsync" \
          ./dist/ "$TARGET_USER@$TARGET_HOST:$TARGET_DIR/"

        echo "🔒 Настройка прав доступа для Nginx (www-data)..."
        ssh $SSH_OPTS "$TARGET_USER@$TARGET_HOST" "sudo chown -R www-data:www-data $TARGET_DIR && sudo chmod -R 755 $TARGET_DIR"

        echo "🧹 Очистка временного ключа..."
        rm -f ~/.ssh/deploy_key

        echo "🎉 Деплой успешно завершен!"
